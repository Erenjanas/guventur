<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NORD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Click to reveal overlay */
        .click-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .click-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .click-text {
            font-size: 14px;
            font-weight: 500;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Banner */
        .banner-wrapper {
            width: 100%;
            max-width: 900px;
            height: 200px;
            position: relative;
            overflow: hidden;
            border-radius: 0 0 16px 16px;
            margin-bottom: -60px;
            z-index: 1;
        }

        .banner-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            border-radius: 0 0 16px 16px;
        }

        /* Profile Container */
        .profile-container {
            width: 100%;
            max-width: 600px;
            padding: 0 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        /* Avatar Video Wrapper */
        .avatar-wrapper {
            position: relative;
            margin-bottom: 16px;
            width: 120px;
            height: 120px;
        }

        .avatar-video {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #0a0a0a;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: block;
        }

        .avatar-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #0a0a0a;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: none;
        }

        /* Status dot */
        .status-dot {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 18px;
            height: 18px;
            background: #3ba55d;
            border-radius: 50%;
            border: 3px solid #0a0a0a;
            z-index: 3;
        }

        /* Username */
        .username {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        /* Location */
        .location {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .location::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #666;
            border-radius: 50%;
        }

        /* Social Links */
        .social-links {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .social-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: #161616;
            border: 1px solid #222;
            border-radius: 10px;
            color: #ccc;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .social-btn:hover {
            background: #1a1a1a;
            border-color: #333;
            transform: translateY(-1px);
        }

        .social-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* Music Player */
        .music-player {
            width: 100%;
            background: #111;
            border: 1px solid #222;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .music-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .music-cover {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            background: #222;
            object-fit: cover;
        }

        .music-info {
            flex: 1;
        }

        .music-title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 2px;
        }

        .music-artist {
            font-size: 12px;
            color: #666;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            margin-bottom: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #222;
            border-radius: 2px;
            overflow: hidden;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #fff;
            border-radius: 2px;
            transition: width 0.1s linear;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #555;
            margin-top: 6px;
        }

        /* Controls */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 8px;
        }

        .control-btn {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .control-btn:hover {
            color: #fff;
        }

        .control-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .play-btn svg {
            width: 28px;
            height: 28px;
        }

        /* Views */
        .views {
            font-size: 12px;
            color: #444;
            margin-top: 8px;
        }

        /* Volume */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .volume-slider {
            width: 80px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #222;
            border-radius: 2px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #222;
            border-radius: 3px;
        }
    </style>
<base target="_blank">
</head>
<body>
    <!-- Click to Reveal Overlay -->
    <div class="click-overlay" id="clickOverlay">
        <span class="click-text">Click to reveal</span>
    </div>

    <!-- Banner Video -->
    <div class="banner-wrapper">
        <video class="banner-video" id="bannerVideo" muted loop playsinline preload="auto">
            <source src="banner.mp4" type="video/mp4">
        </video>
        <img src="banner.jpg" alt="Banner" class="banner-img" id="bannerImg">
    </div>

    <div class="profile-container">
        <!-- Avatar Video -->
        <div class="avatar-wrapper">
            <video class="avatar-video" id="avatarVideo" muted loop playsinline preload="auto">
                <source src="avatar.mp4" type="video/mp4">
            </video>
            <img src="avatar.jpg" alt="Avatar" class="avatar-img" id="avatarImg">
            <div class="status-dot"></div>
        </div>

        <!-- Username -->
        <h1 class="username">NORD</h1>

        <!-- Location -->
        <div class="location">Nowhere</div>

        <!-- Social Links -->
        <div class="social-links">
            <a href="https://discord.com" target="_blank" class="social-btn">
                <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                Discord
            </a>
            <a href="https://t.me/GAYRlMESRU" target="_blank" class="social-btn">
                <svg viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
                Telegram
            </a>
            <a href="https://wa.me/16395697826" target="_blank" class="social-btn">
                <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.008-.57-.008-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                WhatsApp
            </a>
        </div>

        <!-- Music Player -->
        <div class="music-player">
            <div class="music-header">
                <img src="cover.jpg" alt="Cover" class="music-cover" id="musicCover">
                <div class="music-info">
                    <div class="music-title" id="musicTitle">KESKİN ASLAN YAKIŞMAZ KAFESTE</div>
                    <div class="music-artist" id="musicArtist">Loading...</div>
                </div>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="time-display">
                    <span id="currentTime">00:00</span>
                    <span id="duration">00:00</span>
                </div>
            </div>

            <div class="controls">
                <button class="control-btn" id="prevBtn">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button class="control-btn play-btn" id="playBtn">
                    <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
                    <svg viewBox="0 0 24 24" id="pauseIcon" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button class="control-btn" id="nextBtn">
                    <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>

            <div class="volume-container">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#666"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="50">
            </div>
        </div>

        <div class="views" id="views">0 Views</div>
    </div>

    <!-- Audio Element -->
    <audio id="audioPlayer" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Elements
        const overlay = document.getElementById('clickOverlay');
        const audio = document.getElementById('audioPlayer');
        const bannerVideo = document.getElementById('bannerVideo');
        const bannerImg = document.getElementById('bannerImg');
        const avatarVideo = document.getElementById('avatarVideo');
        const avatarImg = document.getElementById('avatarImg');

        // Fallback: video yoksa image göster
        bannerVideo.onerror = function() {
            bannerVideo.style.display = 'none';
            bannerImg.style.display = 'block';
        };

        avatarVideo.onerror = function() {
            avatarVideo.style.display = 'none';
            avatarImg.style.display = 'block';
        };

        // Click to reveal
        overlay.addEventListener('click', function() {
            overlay.classList.add('hidden');

            // Play audio
            audio.play().catch(e => console.log('Autoplay blocked:', e));

            // Play banner video (unmute after click)
            bannerVideo.muted = false;
            bannerVideo.play().catch(e => console.log('Banner video blocked:', e));

            // Play avatar video (unmute after click)
            avatarVideo.muted = false;
            avatarVideo.play().catch(e => console.log('Avatar video blocked:', e));
        });

        // Music Player Controls
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const volumeSlider = document.getElementById('volumeSlider');

        let isPlaying = false;

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        playBtn.addEventListener('click', function() {
            if (isPlaying) {
                audio.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            } else {
                audio.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            }
            isPlaying = !isPlaying;
        });

        audio.addEventListener('timeupdate', function() {
            const progress = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = progress + '%';
            currentTimeEl.textContent = formatTime(audio.currentTime);
            if (audio.duration) {
                durationEl.textContent = formatTime(audio.duration);
            }
        });

        audio.addEventListener('loadedmetadata', function() {
            durationEl.textContent = formatTime(audio.duration);
        });

        progressBar.addEventListener('click', function(e) {
            const rect = progressBar.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            audio.currentTime = pos * audio.duration;
        });

        volumeSlider.addEventListener('input', function() {
            audio.volume = this.value / 100;
        });

        // Set initial volume
        audio.volume = 0.5;

        // Views counter
        const viewsEl = document.getElementById('views');
        const randomViews = Math.floor(Math.random() * 5000) + 100;
        viewsEl.textContent = randomViews + ' Views';

        // Music cover fallback
        document.getElementById('musicCover').onerror = function() {
            this.style.background = '#222';
        };
    </script>
</body>
</html>
