<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NORD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Click to reveal overlay */
        .click-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .click-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .click-text {
            font-size: 14px;
            font-weight: 500;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 4px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Banner - Full screen with blur */
        .banner-wrapper {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .banner-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            display: block;
            filter: blur(8px) brightness(0.4);
        }

        .banner-img {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            display: none;
            filter: blur(8px) brightness(0.4);
        }

        /* Floating particles */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float-up linear infinite;
        }

        @keyframes float-up {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }

        /* Scanline effect */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.03) 2px,
                rgba(0, 0, 0, 0.03) 4px
            );
            pointer-events: none;
            z-index: 3;
        }

        /* Vignette */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 0%, transparent 40%, rgba(0,0,0,0.7) 100%);
            pointer-events: none;
            z-index: 2;
        }

        /* Banner content overlay */
        .banner-content {
            position: relative;
            z-index: 4;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Avatar */
        .avatar-wrapper {
            position: relative;
            margin-bottom: 20px;
            width: 140px;
            height: 140px;
        }

        .avatar-video {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255,255,255,0.1);
            box-shadow: 0 0 40px rgba(255,255,255,0.1), 0 0 80px rgba(255,255,255,0.05);
            display: block;
            animation: avatar-glow 3s ease-in-out infinite;
        }

        .avatar-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255,255,255,0.1);
            box-shadow: 0 0 40px rgba(255,255,255,0.1), 0 0 80px rgba(255,255,255,0.05);
            display: none;
            animation: avatar-glow 3s ease-in-out infinite;
        }

        @keyframes avatar-glow {
            0%, 100% { 
                box-shadow: 0 0 40px rgba(255,255,255,0.1), 0 0 80px rgba(255,255,255,0.05);
                border-color: rgba(255,255,255,0.1);
            }
            50% { 
                box-shadow: 0 0 60px rgba(255,255,255,0.2), 0 0 120px rgba(255,255,255,0.1);
                border-color: rgba(255,255,255,0.2);
            }
        }

        /* Status dot */
        .status-dot {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 20px;
            height: 20px;
            background: #3ba55d;
            border-radius: 50%;
            border: 3px solid #0a0a0a;
            z-index: 5;
            animation: status-blink 2s ease-in-out infinite;
        }

        @keyframes status-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Username */
        .username {
            font-size: 48px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 6px;
            letter-spacing: 8px;
            text-transform: uppercase;
            animation: text-shimmer 4s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(255,255,255,0.2);
        }

        @keyframes text-shimmer {
            0%, 100% { 
                text-shadow: 0 0 30px rgba(255,255,255,0.2), 0 0 60px rgba(255,255,255,0.05);
                letter-spacing: 8px;
            }
            50% { 
                text-shadow: 0 0 40px rgba(255,255,255,0.4), 0 0 80px rgba(255,255,255,0.1);
                letter-spacing: 12px;
            }
        }

        /* Location */
        .location {
            font-size: 13px;
            color: #666;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: fade-in-up 1s ease-out 0.3s both;
        }

        .location::before {
            content: "";
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #666;
            border-radius: 50%;
            animation: dot-pulse 2s ease-in-out infinite;
        }

        @keyframes dot-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
        }

        /* Social Links */
        .social-links {
            display: flex;
            gap: 14px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
            animation: fade-in-up 1s ease-out 0.5s both;
        }

        .social-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            color: #aaa;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .social-btn:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.2);
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .social-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            transition: transform 0.3s ease;
        }

        .social-btn:hover svg {
            transform: scale(1.2);
        }

        /* Music Player */
        .music-player {
            width: 100%;
            max-width: 420px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            backdrop-filter: blur(20px);
            animation: fade-in-up 1s ease-out 0.7s both;
        }

        .music-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }

        .music-cover {
            width: 52px;
            height: 52px;
            border-radius: 8px;
            background: #222;
            object-fit: cover;
            animation: cover-spin 8s linear infinite paused;
        }

        .music-cover.playing {
            animation-play-state: running;
        }

        @keyframes cover-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .music-info {
            flex: 1;
            overflow: hidden;
        }

        .music-title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-artist {
            font-size: 12px;
            color: #555;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            margin-bottom: 12px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.06);
            border-radius: 2px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }

        .progress-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            animation: shimmer 2s linear infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #fff, #888);
            border-radius: 2px;
            transition: width 0.1s linear;
            position: relative;
            z-index: 1;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #444;
            margin-top: 8px;
        }

        /* Controls */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin-top: 12px;
        }

        .control-btn {
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            border-radius: 50%;
        }

        .control-btn:hover {
            color: #fff;
            transform: scale(1.15);
        }

        .control-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .play-btn {
            width: 48px;
            height: 48px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .play-btn:hover {
            background: rgba(255,255,255,0.15);
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255,255,255,0.1);
        }

        .play-btn svg {
            width: 24px;
            height: 24px;
        }

        /* Views */
        .views {
            font-size: 12px;
            color: #333;
            margin-top: 8px;
            animation: fade-in-up 1s ease-out 0.9s both;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Volume */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
            justify-content: center;
        }

        .volume-slider {
            width: 100px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255,255,255,0.08);
            border-radius: 2px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
            transition: transform 0.2s;
        }

        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }

        /* Fade in animations */
        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Equalizer bars */
        .equalizer {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 20px;
            margin-left: auto;
        }

        .eq-bar {
            width: 3px;
            background: linear-gradient(to top, #fff, transparent);
            border-radius: 1px;
            animation: eq-bounce 0.5s ease-in-out infinite alternate;
        }

        .eq-bar:nth-child(1) { height: 8px; animation-delay: 0s; }
        .eq-bar:nth-child(2) { height: 14px; animation-delay: 0.1s; }
        .eq-bar:nth-child(3) { height: 10px; animation-delay: 0.2s; }
        .eq-bar:nth-child(4) { height: 16px; animation-delay: 0.15s; }
        .eq-bar:nth-child(5) { height: 6px; animation-delay: 0.05s; }

        @keyframes eq-bounce {
            0% { transform: scaleY(0.3); opacity: 0.3; }
            100% { transform: scaleY(1); opacity: 1; }
        }

        /* Scroll indicator */
        .scroll-indicator {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            animation: bounce 2s ease-in-out infinite;
            z-index: 5;
        }

        .scroll-indicator span {
            font-size: 10px;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .scroll-arrow {
            width: 20px;
            height: 20px;
            border-right: 2px solid #444;
            border-bottom: 2px solid #444;
            transform: rotate(45deg);
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(10px); }
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #222;
            border-radius: 3px;
        }
    </style>

                </div>

                <div class="volume-container">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="#444"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="50">
                </div>
            </div>

            <div class="views" id="views">0 Views</div>
        </div>

        <!-- Scroll indicator -->
        <div class="scroll-indicator" id="scrollIndicator">
            <span>Scroll</span>
            <div class="scroll-arrow"></div>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="audioPlayer" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Generate particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 50; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDuration = (Math.random() * 10 + 5) + 's';
            particle.style.animationDelay = Math.random() * 5 + 's';
            particle.style.width = (Math.random() * 3 + 1) + 'px';
            particle.style.height = particle.style.width;
            particle.style.opacity = Math.random() * 0.5 + 0.1;
            particlesContainer.appendChild(particle);
        }

        // Elements
        const overlay = document.getElementById('clickOverlay');
        const audio = document.getElementById('audioPlayer');
        const bannerVideo = document.getElementById('bannerVideo');
        const bannerImg = document.getElementById('bannerImg');
        const avatarVideo = document.getElementById('avatarVideo');
        const avatarImg = document.getElementById('avatarImg');
        const musicCover = document.getElementById('musicCover');
        const equalizer = document.getElementById('equalizer');
        const scrollIndicator = document.getElementById('scrollIndicator');

        // Fallback: video yoksa image göster
        bannerVideo.onerror = function() {
            bannerVideo.style.display = 'none';
            bannerImg.style.display = 'block';
        };

        avatarVideo.onerror = function() {
            avatarVideo.style.display = 'none';
            avatarImg.style.display = 'block';
        };

        // Click to reveal
        overlay.addEventListener('click', function() {
            overlay.classList.add('hidden');

            // Play audio
            audio.play().catch(e => console.log('Autoplay blocked:', e));

            // Play banner video
            bannerVideo.muted = false;
            bannerVideo.play().catch(e => console.log('Banner video blocked:', e));

            // Play avatar video
            avatarVideo.muted = false;
            avatarVideo.play().catch(e => console.log('Avatar video blocked:', e));

            // Start cover spin
            musicCover.classList.add('playing');

            // Start equalizer
            equalizer.style.opacity = '1';
        };

        // Music Player Controls
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const volumeSlider = document.getElementById('volumeSlider');

        let isPlaying = false;

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        playBtn.addEventListener('click', function() {
            if (isPlaying) {
                audio.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                musicCover.classList.remove('playing');
                equalizer.style.opacity = '0.3';
            } else {
                audio.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                musicCover.classList.add('playing');
                equalizer.style.opacity = '1';
            }
            isPlaying = !isPlaying;
        });

        audio.addEventListener('timeupdate', function() {
            const progress = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = progress + '%';
            currentTimeEl.textContent = formatTime(audio.currentTime);
            if (audio.duration) {
                durationEl.textContent = formatTime(audio.duration);
            }
        });

        audio.addEventListener('loadedmetadata', function() {
            durationEl.textContent = formatTime(audio.duration);
        });

        progressBar.addEventListener('click', function(e) {
            const rect = progressBar.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            audio.currentTime = pos * audio.duration;
        });

        volumeSlider.addEventListener('input', function() {
            audio.volume = this.value / 100;
        });

        // Set initial volume
        audio.volume = 0.5;

        // Views counter
        const viewsEl = document.getElementById('views');
        const randomViews = Math.floor(Math.random() * 5000) + 100;
        viewsEl.textContent = randomViews + ' Views';

        // Music cover fallback
        musicCover.onerror = function() {
            this.style.background = '#222';
        };

        // Hide scroll indicator on scroll
        window.addEventListener('scroll', function() {
            if (window.scrollY > 50) {
                scrollIndicator.style.opacity = '0';
            } else {
                scrollIndicator.style.opacity = '1';
            }
        });
    </script>
</body>
</html>
