<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NORD | Cyber Dev</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --neon-blue: #00a8e8;
            --neon-cyan: #00f0ff;
            --neon-purple: #a855f7;
            --dark-bg: #050508;
            --glass-bg: rgba(255,255,255,0.03);
        }
        body {
            background: var(--dark-bg);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }
        #codeCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; opacity: 0.15; pointer-events: none;
        }
        #particleCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2; pointer-events: none;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,168,232,0.03) 2px, rgba(0,168,232,0.03) 4px);
            animation: scanlineMove 8s linear infinite;
        }
        @keyframes scanlineMove { 0% { background-position: 0 0; } 100% { background-position: 0 100px; } }
        .vignette {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 3; pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
        }
        .main-container {
            display: flex; flex-direction: column; align-items: center;
            justify-content: flex-start; min-height: 100vh;
            padding: 40px 20px 30px; position: relative; z-index: 10; gap: 30px;
        }
        .nord-title-container { position: relative; text-align: center; }
        .nord-title {
            font-family: 'Orbitron', sans-serif; font-size: clamp(3rem, 12vw, 8rem);
            font-weight: 900; letter-spacing: 20px; color: #fff; text-transform: uppercase;
            text-align: center; line-height: 1.2; position: relative;
            animation: titleReveal 2s ease-out forwards; opacity: 0;
            text-shadow: 0 0 20px rgba(0,168,232,0.6), 0 0 40px rgba(0,168,232,0.3), 0 0 80px rgba(0,168,232,0.1);
        }
        .nord-title::before, .nord-title::after {
            content: 'NORD'; position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.8;
        }
        .nord-title::before {
            color: #00f0ff; animation: glitch1 2s infinite linear alternate-reverse;
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
        }
        .nord-title::after {
            color: #a855f7; animation: glitch2 2s infinite linear alternate-reverse;
            clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
        }
        @keyframes titleReveal {
            0% { opacity: 0; transform: translateY(-50px) scale(0.8); filter: blur(20px); }
            50% { opacity: 0.5; filter: blur(5px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }
        @keyframes glitch1 {
            0%, 100% { transform: translate(0); } 20% { transform: translate(-3px, 2px); }
            40% { transform: translate(3px, -2px); } 60% { transform: translate(-2px, 0); }
            80% { transform: translate(2px, 1px); }
        }
        @keyframes glitch2 {
            0%, 100% { transform: translate(0); } 20% { transform: translate(3px, -2px); }
            40% { transform: translate(-3px, 2px); } 60% { transform: translate(2px, 0); }
            80% { transform: translate(-2px, -1px); }
        }
        .subtitle {
            font-family: 'JetBrains Mono', monospace; font-size: 0.9rem;
            color: var(--neon-cyan); letter-spacing: 8px; text-transform: uppercase;
            opacity: 0; animation: subtitleReveal 2s ease-out 1s forwards; margin-top: 10px;
        }
        @keyframes subtitleReveal { 0% { opacity: 0; letter-spacing: 20px; } 100% { opacity: 0.7; letter-spacing: 8px; } }
        .profile-section {
            position: relative; width: 240px; height: 240px;
            animation: profileReveal 1.5s ease-out 0.5s forwards; opacity: 0; transform: scale(0.8);
        }
        @keyframes profileReveal { to { opacity: 1; transform: scale(1); } }
        .profile-img {
            width: 240px; height: 240px; border-radius: 50%; object-fit: cover;
            border: 2px solid rgba(0,240,255,0.3);
            box-shadow: 0 0 30px rgba(0,168,232,0.3), 0 0 60px rgba(0,168,232,0.15), inset 0 0 30px rgba(0,168,232,0.1);
            animation: imgFloat 4s ease-in-out infinite, hologramFlicker 3s infinite;
            transition: all 0.4s ease; position: relative; z-index: 2;
            filter: brightness(1.1) contrast(1.1);
        }
        .profile-img:hover {
            transform: scale(1.08);
            box-shadow: 0 0 50px rgba(0,240,255,0.5), 0 0 100px rgba(0,168,232,0.3), inset 0 0 40px rgba(0,240,255,0.2);
        }
        @keyframes imgFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes hologramFlicker {
            0%, 100% { opacity: 1; } 5% { opacity: 0.95; } 10% { opacity: 1; } 15% { opacity: 0.9; }
            20% { opacity: 1; } 50% { opacity: 0.98; } 52% { opacity: 0.85; } 54% { opacity: 0.98; }
        }
        .profile-ring {
            position: absolute; top: -15px; left: -15px; right: -15px; bottom: -15px;
            border-radius: 50%; border: 2px solid transparent;
            border-top-color: rgba(0,240,255,0.5); border-right-color: rgba(168,85,247,0.3);
            animation: spin 6s linear infinite; z-index: 1;
        }
        .profile-ring:nth-child(2) {
            top: -30px; left: -30px; right: -30px; bottom: -30px;
            border-top-color: rgba(168,85,247,0.4); border-left-color: rgba(0,240,255,0.3);
            animation: spin 10s linear infinite reverse;
        }
        .profile-ring:nth-child(3) {
            top: -45px; left: -45px; right: -45px; bottom: -45px;
            border: 1px dashed rgba(0,240,255,0.2); animation: spin 15s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .profile-scan {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%;
            background: linear-gradient(180deg, transparent 0%, rgba(0,240,255,0.1) 50%, transparent 100%);
            animation: scanMove 3s ease-in-out infinite; pointer-events: none; z-index: 3;
        }
        @keyframes scanMove { 0%, 100% { transform: translateY(-100%); } 50% { transform: translateY(100%); } }
        .message-box {
            max-width: 550px; text-align: center; padding: 25px 35px;
            background: var(--glass-bg); border: 1px solid rgba(0,240,255,0.15);
            border-radius: 20px; backdrop-filter: blur(15px); position: relative;
            overflow: hidden; animation: messageReveal 1.5s ease-out 1s forwards;
            opacity: 0; transform: translateY(20px);
        }
        .message-box::before {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, transparent, rgba(0,240,255,0.1), transparent);
            border-radius: 20px; z-index: -1; animation: borderGlow 3s ease-in-out infinite;
        }
        @keyframes borderGlow { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        @keyframes messageReveal { to { opacity: 1; transform: translateY(0); } }
        .message-text {
            font-size: 1.15rem; line-height: 1.8; color: #c0c0d0;
            position: relative; z-index: 1; font-family: 'JetBrains Mono', monospace;
        }
        .message-text .highlight {
            color: var(--neon-cyan); font-weight: 700; text-shadow: 0 0 10px rgba(0,240,255,0.5);
        }
        .cursor-blink {
            display: inline-block; width: 2px; height: 1.2em;
            background: var(--neon-cyan); animation: blink 0.8s infinite;
            vertical-align: text-bottom; margin-left: 2px;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .buttons-container {
            display: flex; gap: 25px; flex-wrap: wrap; justify-content: center;
            animation: buttonsReveal 1.5s ease-out 1.5s forwards; opacity: 0; transform: translateY(20px);
        }
        @keyframes buttonsReveal { to { opacity: 1; transform: translateY(0); } }
        .btn {
            display: inline-flex; align-items: center; gap: 12px; padding: 16px 45px;
            color: #fff; text-decoration: none; font-family: 'Orbitron', sans-serif;
            font-size: 1rem; font-weight: 700; letter-spacing: 3px; border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.1); position: relative; overflow: hidden;
            transition: all 0.4s ease; cursor: pointer; background: rgba(0,0,0,0.3);
        }
        .btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }
        .btn:hover::before { left: 100%; }
        .btn:hover { transform: translateY(-5px) scale(1.05); box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
        .btn:active { transform: translateY(-2px) scale(0.98); }
        .telegram-btn {
            border-color: rgba(0,168,232,0.5);
            box-shadow: 0 0 20px rgba(0,168,232,0.2), inset 0 0 20px rgba(0,168,232,0.05);
        }
        .telegram-btn:hover {
            box-shadow: 0 0 40px rgba(0,168,232,0.4), inset 0 0 30px rgba(0,168,232,0.1);
            border-color: rgba(0,240,255,0.8); background: rgba(0,168,232,0.1);
        }
        .whatsapp-btn {
            border-color: rgba(37,211,102,0.5);
            box-shadow: 0 0 20px rgba(37,211,102,0.2), inset 0 0 20px rgba(37,211,102,0.05);
        }
        .whatsapp-btn:hover {
            box-shadow: 0 0 40px rgba(37,211,102,0.4), inset 0 0 30px rgba(37,211,102,0.1);
            border-color: rgba(37,211,102,0.8); background: rgba(37,211,102,0.1);
        }
        .btn-icon { width: 24px; height: 24px; fill: #fff; filter: drop-shadow(0 0 5px currentColor); }
        .music-section {
            width: 100%; max-width: 450px;
            animation: musicReveal 1.5s ease-out 2s forwards; opacity: 0; transform: translateY(20px);
        }
        @keyframes musicReveal { to { opacity: 1; transform: translateY(0); } }
        .music-player {
            background: var(--glass-bg); border: 1px solid rgba(0,240,255,0.1);
            border-radius: 25px; padding: 25px 30px; backdrop-filter: blur(15px);
            position: relative; overflow: hidden; transition: all 0.3s ease;
        }
        .music-player:hover { border-color: rgba(0,240,255,0.25); box-shadow: 0 0 40px rgba(0,168,232,0.1); }
        .music-player::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,240,255,0.03), transparent);
            animation: shimmer 5s infinite;
        }
        @keyframes shimmer { 0% { left: -100%; } 100% { left: 200%; } }
        .music-info { text-align: center; margin-bottom: 20px; }
        .music-info h3 {
            font-family: 'Orbitron', sans-serif; font-size: 1.1rem; color: #fff;
            margin-bottom: 5px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(0,240,255,0.3);
        }
        .music-info p { font-size: 0.85rem; color: #888; font-family: 'JetBrains Mono', monospace; }
        .wave-container {
            display: flex; align-items: flex-end; justify-content: center; gap: 3px;
            height: 60px; margin-bottom: 20px; padding: 0 10px;
        }
        .wave-bar {
            width: 5px; background: linear-gradient(to top, #0064ff, #00a8e8, #00f0ff);
            border-radius: 3px; animation: wave 0.8s ease-in-out infinite;
            box-shadow: 0 0 10px rgba(0,168,232,0.5); transition: all 0.3s ease;
        }
        .wave-bar:nth-child(1) { height: 15px; animation-delay: 0s; }
        .wave-bar:nth-child(2) { height: 32px; animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { height: 22px; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { height: 42px; animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { height: 28px; animation-delay: 0.4s; }
        .wave-bar:nth-child(6) { height: 38px; animation-delay: 0.5s; }
        .wave-bar:nth-child(7) { height: 18px; animation-delay: 0.6s; }
        .wave-bar:nth-child(8) { height: 45px; animation-delay: 0.7s; }
        .wave-bar:nth-child(9) { height: 25px; animation-delay: 0.8s; }
        .wave-bar:nth-child(10) { height: 35px; animation-delay: 0.9s; }
        .wave-bar:nth-child(11) { height: 16px; animation-delay: 1.0s; }
        .wave-bar:nth-child(12) { height: 30px; animation-delay: 1.1s; }
        .wave-bar:nth-child(13) { height: 20px; animation-delay: 1.2s; }
        .wave-bar:nth-child(14) { height: 40px; animation-delay: 1.3s; }
        .wave-bar:nth-child(15) { height: 18px; animation-delay: 1.4s; }
        .wave-bar:nth-child(16) { height: 36px; animation-delay: 1.5s; }
        .wave-bar:nth-child(17) { height: 24px; animation-delay: 1.6s; }
        .wave-bar:nth-child(18) { height: 44px; animation-delay: 1.7s; }
        .wave-bar:nth-child(19) { height: 19px; animation-delay: 1.8s; }
        .wave-bar:nth-child(20) { height: 33px; animation-delay: 1.9s; }
        @keyframes wave { 0%, 100% { transform: scaleY(0.4); opacity: 0.4; } 50% { transform: scaleY(1); opacity: 1; } }
        .wave-container.paused .wave-bar {
            animation-play-state: paused; height: 6px !important; opacity: 0.2;
            box-shadow: none; transition: all 0.5s ease;
        }
        .music-controls { display: flex; align-items: center; justify-content: center; gap: 25px; margin-bottom: 18px; }
        .play-btn {
            width: 60px; height: 60px; border-radius: 50%;
            background: linear-gradient(135deg, #0064ff, #00a8e8); border: none;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease; box-shadow: 0 0 25px rgba(0,168,232,0.4);
            cursor: pointer; position: relative; overflow: hidden;
        }
        .play-btn::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 60%);
            opacity: 0; transition: opacity 0.3s;
        }
        .play-btn:hover::after { opacity: 1; }
        .play-btn:hover { transform: scale(1.15); box-shadow: 0 0 40px rgba(0,240,255,0.6); }
        .play-btn svg { width: 24px; height: 24px; fill: #fff; position: relative; z-index: 1; }
        .play-btn .play-icon { margin-left: 3px; }
        .play-btn .pause-icon { display: none; }
        .music-player.playing .play-btn { animation: playPulse 2s ease-in-out infinite; }
        @keyframes playPulse { 0%, 100% { box-shadow: 0 0 25px rgba(0,168,232,0.4); } 50% { box-shadow: 0 0 40px rgba(0,240,255,0.7); } }
        .progress-area { margin-bottom: 15px; }
        .time-display {
            display: flex; justify-content: space-between; font-size: 0.75rem;
            color: #555; margin-bottom: 8px; font-family: 'JetBrains Mono', monospace;
        }
        .progress-container {
            width: 100%; height: 5px; background: rgba(255,255,255,0.05);
            border-radius: 3px; overflow: hidden; cursor: pointer; position: relative;
        }
        .progress-container::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(0,240,255,0.1), transparent);
            animation: progressShine 3s infinite;
        }
        @keyframes progressShine { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
        .progress-bar {
            height: 100%; width: 0%; background: linear-gradient(90deg, #0064ff, #00a8e8, #00f0ff);
            border-radius: 3px; transition: width 0.1s linear; position: relative;
            box-shadow: 0 0 10px rgba(0,168,232,0.5);
        }
        .progress-bar::after {
            content: ''; position: absolute; right: -6px; top: 50%; transform: translateY(-50%);
            width: 12px; height: 12px; background: #fff; border-radius: 50%;
            box-shadow: 0 0 15px rgba(0,240,255,0.8); opacity: 0; transition: opacity 0.3s;
        }
        .music-player:hover .progress-bar::after { opacity: 1; }
        .volume-area { display: flex; align-items: center; gap: 10px; }
        .volume-icon { width: 18px; height: 18px; fill: #555; transition: fill 0.3s; }
        .music-player:hover .volume-icon { fill: var(--neon-cyan); }
        .volume-slider {
            flex: 1; height: 4px; background: rgba(255,255,255,0.05);
            border-radius: 2px; outline: none; cursor: pointer; -webkit-appearance: none;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
            background: var(--neon-cyan); box-shadow: 0 0 10px rgba(0,240,255,0.6);
            cursor: pointer; transition: transform 0.2s;
        }
        .volume-slider::-webkit-slider-thumb:hover { transform: scale(1.3); }
        .volume-slider::-moz-range-thumb {
            width: 12px; height: 12px; border-radius: 50%; background: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0,240,255,0.6); border: none; cursor: pointer;
        }
        .skills-section {
            display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
            animation: skillsReveal 1.5s ease-out 2.3s forwards; opacity: 0; transform: translateY(20px);
            max-width: 600px;
        }
        @keyframes skillsReveal { to { opacity: 1; transform: translateY(0); } }
        .skill-badge {
            padding: 8px 18px; background: rgba(0,168,232,0.08);
            border: 1px solid rgba(0,240,255,0.2); border-radius: 20px;
            font-family: 'JetBrains Mono', monospace; font-size: 0.8rem;
            color: var(--neon-cyan); letter-spacing: 1px;
            transition: all 0.3s ease; cursor: default;
        }
        .skill-badge:hover {
            background: rgba(0,168,232,0.2); border-color: rgba(0,240,255,0.5);
            box-shadow: 0 0 20px rgba(0,168,232,0.3); transform: translateY(-3px);
        }
        .footer {
            font-size: 0.8rem; color: #333; letter-spacing: 4px;
            animation: footerReveal 2s ease-out 2.5s forwards; opacity: 0;
            font-family: 'JetBrains Mono', monospace;
        }
        @keyframes footerReveal { to { opacity: 1; } }
        .cursor-glow {
            position: fixed; width: 500px; height: 500px; border-radius: 50%;
            pointer-events: none; z-index: 5;
            background: radial-gradient(circle, rgba(0,168,232,0.08) 0%, rgba(0,168,232,0.02) 40%, transparent 70%);
            transform: translate(-50%, -50%); transition: all 0.1s ease; mix-blend-mode: screen;
        }
        @media (max-width: 600px) {
            .main-container { padding: 30px 15px 20px; gap: 25px; }
            .nord-title { font-size: clamp(2.5rem, 10vw, 4rem); letter-spacing: 10px; }
            .subtitle { font-size: 0.7rem; letter-spacing: 4px; }
            .profile-section, .profile-img { width: 200px; height: 200px; }
            .message-text { font-size: 1rem; }
            .btn { padding: 14px 35px; font-size: 0.9rem; }
            .buttons-container { flex-direction: column; align-items: center; }
            .music-section { max-width: 100%; }
            .wave-container { height: 45px; }
            .wave-bar { width: 3px; }
            .skills-section { gap: 8px; }
            .skill-badge { padding: 6px 14px; font-size: 0.7rem; }
        }
    </style>
</head>

    <script>
        // ===== ANIMATED CODE BACKGROUND =====
        const codeCanvas = document.getElementById('codeCanvas');
        const codeCtx = codeCanvas.getContext('2d');
        function resizeCodeCanvas() { codeCanvas.width = window.innerWidth; codeCanvas.height = window.innerHeight; }
        resizeCodeCanvas(); window.addEventListener('resize', resizeCodeCanvas);
        const codeSnippets = [
            'function init() {', 'const data = [];', 'return true;', 'import React from',
            'class Nord {', 'async function() {', 'await fetch()', 'console.log("NORD")',
            'if (user) {', 'while (true) {', 'for (let i=0;', 'document.querySelector',
            'npm install', 'git push origin', 'docker build', 'node server.js',
            'const express =', 'module.exports', 'export default', 'useEffect(() =>',
            'const [state,', 'setInterval(()', 'clearTimeout(id)', 'JSON.parse(data)',
            'Math.random()', 'new Date()', 'Array.from()', 'Object.keys(obj)',
            'try {', 'catch (err)', 'finally {', 'throw new Error',
            'Promise.all([])', 'async/await', 'const api = axios', 'res.status(200)',
            'req.params.id', 'db.collection()', 'findOne()', 'updateMany()',
            'socket.emit()', 'io.on("connect")', 'redis.get(key)', 'cache.hit()'
        ];
        let codeColumns = [];
        const fontSize = 14;
        function initCodeColumns() {
            codeColumns = [];
            const columns = Math.floor(codeCanvas.width / fontSize);
            for (let i = 0; i < columns; i++) {
                codeColumns.push({
                    x: i * fontSize, y: Math.random() * codeCanvas.height,
                    speed: Math.random() * 1.5 + 0.5,
                    text: codeSnippets[Math.floor(Math.random() * codeSnippets.length)],
                    opacity: Math.random() * 0.5 + 0.1, charIndex: 0
                });
            }
        }
        initCodeColumns(); window.addEventListener('resize', initCodeColumns);
        function drawCodeBackground() {
            codeCtx.fillStyle = 'rgba(5, 5, 8, 0.05)';
            codeCtx.fillRect(0, 0, codeCanvas.width, codeCanvas.height);
            codeCtx.font = fontSize + 'px "JetBrains Mono", monospace';
            codeColumns.forEach(col => {
                codeCtx.fillStyle = `rgba(0, 168, 232, ${col.opacity})`;
                if (col.charIndex < col.text.length) {
                    codeCtx.fillText(col.text[col.charIndex], col.x, col.y);
                    col.charIndex++;
                } else { codeCtx.fillText(col.text, col.x, col.y); }
                col.y += col.speed;
                if (col.y > codeCanvas.height + 50) {
                    col.y = -50;
                    col.text = codeSnippets[Math.floor(Math.random() * codeSnippets.length)];
                    col.charIndex = 0; col.opacity = Math.random() * 0.5 + 0.1;
                }
            });
            requestAnimationFrame(drawCodeBackground);
        }
        drawCodeBackground();

        // ===== PARTICLE NETWORK =====
        const particleCanvas = document.getElementById('particleCanvas');
        const pCtx = particleCanvas.getContext('2d');
        function resizeParticleCanvas() { particleCanvas.width = window.innerWidth; particleCanvas.height = window.innerHeight; }
        resizeParticleCanvas(); window.addEventListener('resize', resizeParticleCanvas);
        const particles = [];
        const particleCount = 80;
        const connectionDistance = 150;
        class Particle {
            constructor() {
                this.x = Math.random() * particleCanvas.width;
                this.y = Math.random() * particleCanvas.height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.radius = Math.random() * 2 + 1;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0 || this.x > particleCanvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > particleCanvas.height) this.vy *= -1;
            }
            draw() {
                pCtx.beginPath();
                pCtx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                pCtx.fillStyle = `rgba(0, 240, 255, ${this.opacity})`;
                pCtx.fill();
            }
        }
        for (let i = 0; i < particleCount; i++) particles.push(new Particle());
        function drawParticles() {
            pCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < connectionDistance) {
                        pCtx.beginPath();
                        pCtx.moveTo(particles[i].x, particles[i].y);
                        pCtx.lineTo(particles[j].x, particles[j].y);
                        pCtx.strokeStyle = `rgba(0, 168, 232, ${0.15 * (1 - dist / connectionDistance)})`;
                        pCtx.lineWidth = 0.5; pCtx.stroke();
                    }
                }
            }
            requestAnimationFrame(drawParticles);
        }
        drawParticles();

        // ===== MOUSE GLOW =====
        const cursorGlow = document.getElementById('cursorGlow');
        let mouseX = 0, mouseY = 0, glowX = 0, glowY = 0;
        document.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
        function animateGlow() {
            glowX += (mouseX - glowX) * 0.1;
            glowY += (mouseY - glowY) * 0.1;
            cursorGlow.style.left = glowX + 'px';
            cursorGlow.style.top = glowY + 'px';
            requestAnimationFrame(animateGlow);
        }
        animateGlow();

        // ===== TYPING EFFECT =====
        const typingText = document.getElementById('typingText');
        const fullText = 'Selam ben <span class="highlight">NORD</span>, sana daha hızlı yardımcı olabilmem için selam verdikten sonra konuya gir.';
        let charIndex = 0;
        function typeWriter() {
            if (charIndex < fullText.length) {
                typingText.innerHTML = fullText.substring(0, charIndex + 1) + '<span class="cursor-blink"></span>';
                charIndex++;
                setTimeout(typeWriter, Math.random() * 50 + 30);
            } else { typingText.innerHTML = fullText + '<span class="cursor-blink"></span>'; }
        }
        setTimeout(typeWriter, 1500);

        // ===== MUSIC PLAYER =====
        const audioPlayer = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const waveContainer = document.getElementById('waveContainer');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressContainer');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const volumeSlider = document.getElementById('volumeSlider');
        const musicPlayer = document.getElementById('musicPlayer');
        function formatTime(seconds) {
            if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return mins + ':' + secs.toString().padStart(2, '0');
        }
        audioPlayer.addEventListener('loadedmetadata', () => {
            totalTimeEl.textContent = formatTime(audioPlayer.duration);
        });
        playBtn.addEventListener('click', () => {
            if (audioPlayer.paused) {
                const playPromise = audioPlayer.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        playIcon.style.display = 'none';
                        pauseIcon.style.display = 'block';
                        waveContainer.classList.remove('paused');
                        musicPlayer.classList.add('playing');
                    }).catch(error => {
                        alert('Müzik dosyası yüklenemedi. Lütfen music.mp3 dosyasının doğru yerde olduğunu kontrol edin.');
                    });
                }
            } else {
                audioPlayer.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                waveContainer.classList.add('paused');
                musicPlayer.classList.remove('playing');
            }
        });
        audioPlayer.addEventListener('timeupdate', () => {
            if (audioPlayer.duration && isFinite(audioPlayer.duration)) {
                const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                progressBar.style.width = progress + '%';
                currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
            }
        });
        audioPlayer.addEventListener('ended', () => {
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            waveContainer.classList.add('paused');
            musicPlayer.classList.remove('playing');
            progressBar.style.width = '0%';
            currentTimeEl.textContent = '0:00';
        });
        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const percentage = x / rect.width;
            if (audioPlayer.duration && isFinite(audioPlayer.duration)) {
                audioPlayer.currentTime = percentage * audioPlayer.duration;
            }
        });
        volumeSlider.addEventListener('input', (e) => { audioPlayer.volume = e.target.value / 100; });
        audioPlayer.volume = 0.7;

        // ===== SKILL BADGE INTERACTION =====
        document.querySelectorAll('.skill-badge').forEach(badge => {
            badge.addEventListener('mouseenter', () => { badge.style.transform = 'translateY(-3px) scale(1.05)'; });
            badge.addEventListener('mouseleave', () => { badge.style.transform = 'translateY(0) scale(1)'; });
        });

        // ===== PARALLAX EFFECT ON SCROLL =====
        let scrollY = 0;
        window.addEventListener('scroll', () => {
            scrollY = window.scrollY;
            document.querySelector('.profile-section').style.transform = `translateY(${scrollY * 0.1}px)`;
        });
    </script>
